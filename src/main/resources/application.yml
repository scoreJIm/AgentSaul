spring:
  web:
    resources:
      static-locations: classpath:/static/,file:frontend/

  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${AI_MODEL:qwen3-vl-32b-thinking}
          temperature: 0.7

  # MCP (Model Context Protocol) configuration
  mcp:
    client:
      enabled: false  # 设为 true 启用 MCP Client 连接外部 MCP Server
      connections:
        local-mcp-server:
          url: http://localhost:8080

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agent_saul}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  session:
    store-type: redis
    redis:
      namespace: agentsaul:session
    timeout: 30m

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: agentsaul
  tracing:
    sampling:
      probability: 0.1
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      transport: http

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  prompt:
    system: classpath:prompts/saul-system.md
    legal: classpath:prompts/saul-legal.md

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
    enabled: true
  show-actuator: true

agentsaul:
  jwt:
    secret: ${JWT_SECRET:changeme-this-is-a-dev-secret-key-min-32chars}
    access-expiration: 30m
    refresh-expiration: 7d
  api-key: ${API_KEY:}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      llmApi:
        base-config: default
  timelimiter:
    instances:
      llmApi:
        timeout-duration: 60s
        cancel-running-future: true
  retry:
    instances:
      llmApi:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException

logging:
  config: classpath:logback-spring.xml
