spring:
  web:
    resources:
      static-locations: classpath:/static/,file:frontend/

  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${AI_MODEL:glm-5}
          temperature: 0.7

  # MCP (Model Context Protocol) configuration
  mcp:
    client:
      enabled: false  # 设为 true 启用 MCP Client 连接外部 MCP Server
      connections:
        local-mcp-server:
          url: http://localhost:8080

  datasource:
    url: jdbc:mysql://localhost:3306/agent_saul?useUnicode=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: agentsaul
  tracing:
    sampling:
      probability: 0.1

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  prompt:
    system: classpath:prompts/saul-system.md
    legal: classpath:prompts/saul-legal.md

logging:
  config: classpath:logback-spring.xml
