stages:
  - test
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE/agentsaul

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/

test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn test -B
    - mvn jacoco:report -B
  artifacts:
    paths:
      - target/site/jacoco/
    expire_in: 7 days
  coverage: '/Total.*?([0-9]{1,3})%$/'

build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn package -DskipTests -B
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour
  only:
    - main
    - develop

docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA $DOCKER_IMAGE:latest
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_IMAGE:latest
  only:
    - main

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  variables:
    KUBECONFIG: ${KUBE_CONFIG}
  script:
    - kubectl set image deployment/agentsaul agentsaul=$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA -n agentsaul
    - kubectl rollout status deployment/agentsaul -n agentsaul --timeout=120s
    - |
      if [ $? -ne 0 ]; then
        kubectl rollout undo deployment/agentsaul -n agentsaul
        exit 1
      fi
  only:
    - main
  when: manual
